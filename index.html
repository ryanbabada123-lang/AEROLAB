<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fbfcfd" />
    <!-- Favicon en ligne : aucune requête réseau, donc rien à charger en
         démo hors connexion (§51.3). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0f14'/%3E%3Cpath d='M4 17h24M16 6l4 22' stroke='%23fbfcfd' stroke-width='2.4' fill='none'/%3E%3Cpath d='M12 12l8 0' stroke='%231667ff' stroke-width='2.4'/%3E%3C/svg%3E"
    />
    <title>AERO//LAB — Comprendre le vol, devenir pilote</title>
    <meta
      name="description"
      content="AERO//LAB — plateforme immersive de formation aéronautique. Du BIA au cockpit d'un avion de ligne : comprendre le vol, apprendre, progresser."
    />
    <meta name="color-scheme" content="light" />

    <style>
      /* Écran de démarrage inline : jamais d'écran blanc, même en démo
         sur une connexion lente (§51.3). Retiré par l'app au montage. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        gap: 18px;
        justify-items: center;
        background: #05070a;
        color: #eef3f8;
        font: 500 11px/1 ui-monospace, 'SF Mono', Menlo, monospace;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        transition: opacity 700ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot[data-done='true'] {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        font-size: 13px;
        letter-spacing: 0.42em;
        color: #eef3f8;
      }
      #boot .bar {
        width: 132px;
        height: 1px;
        background: rgba(238, 243, 248, 0.16);
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        background: #eef3f8;
        animation: bootscan 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #boot .hint {
        color: #6d7c8c;
        font-size: 10px;
        letter-spacing: 0.24em;
      }
      @keyframes bootscan {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(330%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot" role="status" aria-live="polite">
      <span class="mark">AERO//LAB</span>
      <span class="bar"><i></i></span>
      <span class="hint">Préparation du vol</span>
    </div>

    <!--
      CHIEN DE GARDE DU DÉMARRAGE.

      L'écran de démarrage est retiré par l'application dès sa première
      frame peinte. Mais si le paquet ne s'exécute pas du tout — mémoire
      insuffisante sur un téléphone, module refusé par un navigateur
      intégré, fichier tronqué — plus personne ne le retire, et l'écran
      reste indéfiniment sur « Préparation du vol ». C'est arrivé, et
      l'utilisateur n'avait aucun moyen de savoir ce qui se passait.

      Ce script est volontairement en JavaScript ancien et hors module : il
      s'exécute même là où le paquet principal échoue.
    -->
    <script>
      (function () {
        var t = setTimeout(function () {
          var root = document.getElementById('root')
          var boot = document.getElementById('boot')
          if (!boot || (root && root.children.length)) return
          var hint = boot.querySelector('.hint')
          var bar = boot.querySelector('.bar')
          if (bar) bar.style.display = 'none'
          if (hint) {
            hint.style.maxWidth = '32ch'
            hint.style.lineHeight = '1.7'
            hint.style.textTransform = 'none'
            hint.style.letterSpacing = '0'
            hint.textContent =
              'Le site n’a pas pu démarrer sur ce navigateur. ' +
              'Sur iPhone, enregistrez le fichier dans l’app Fichiers puis ' +
              'ouvrez-le avec Safari — un aperçu intégré n’a pas assez de ' +
              'mémoire pour une page de cette taille.'
          }
        }, 12000)
        window.addEventListener('load', function () {
          var root = document.getElementById('root')
          if (root && root.children.length) clearTimeout(t)
        })
      })()
    </script>

    <noscript>
      <div
        style="
          padding: 48px;
          font: 16px/1.6 system-ui, sans-serif;
          color: #0b0f14;
        "
      >
        <h1 style="letter-spacing: 0.3em">AERO//LAB</h1>
        <p>
          Cette expérience nécessite JavaScript. Activez-le pour accéder aux
          cours, aux simulations et au cockpit.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
